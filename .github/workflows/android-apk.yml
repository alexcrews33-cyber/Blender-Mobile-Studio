
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - alexcrews33-cyber-patch-2
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.js'
      - 'capacitor.config.*'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Generate Android project if missing
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            echo "::error::Capacitor configuration is missing."
            exit 1
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vrchat-avatar-studio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
